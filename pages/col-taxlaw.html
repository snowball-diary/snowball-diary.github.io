<style>
:root{
--ljc-pink-50:#FFF5F8;--ljc-pink-100:#FFE4EC;--ljc-pink-200:#FFD1DC;--ljc-pink-300:#FFB5C8;--ljc-pink-400:#FF9BB0;--ljc-pink-500:#F0A5B8;--ljc-pink-600:#D88BA0;
--ljc-blue-50:#F0F6FC;--ljc-blue-100:#D9EBF7;--ljc-blue-500:#6E9BCB;
--ljc-lavender-50:#F5F0FA;--ljc-lavender-100:#E8D5F0;
--ljc-neutral-0:#FFFFFF;--ljc-neutral-50:#FEFCFD;--ljc-neutral-100:#F9F7FB;--ljc-neutral-200:#F2F0F5;--ljc-neutral-300:#E8E5EE;--ljc-neutral-400:#B8B5C5;--ljc-neutral-500:#928FA5;--ljc-neutral-600:#6E6B85;--ljc-neutral-700:#52505E;--ljc-neutral-800:#3A3848;--ljc-neutral-900:#28263A;
--ljc-success:#8BC4A0;--ljc-success-soft:#EAF5EE;--ljc-warning:#F0C674;--ljc-warning-soft:#FFF5E0;--ljc-info-soft:#F0F6FC;
--ljc-radius-s:8px;--ljc-radius-m:12px;--ljc-radius-l:16px;--ljc-radius-full:9999px;
--font-sans:'LXGW WenKai Web','Quicksand',-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
--font-display:'Quicksand','LXGW WenKai Web','PingFang SC','Microsoft YaHei',sans-serif;
--font-mono:ui-monospace,SFMono-Regular,Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-color:var(--ljc-pink-200) var(--ljc-neutral-100);scrollbar-width:thin}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--ljc-neutral-100)}
::-webkit-scrollbar-thumb{background:var(--ljc-pink-200);border-radius:8px;border:2px solid var(--ljc-neutral-100)}
::-webkit-scrollbar-thumb:hover{background:var(--ljc-pink-300)}
::-webkit-scrollbar-corner{background:var(--ljc-neutral-100)}
body{margin:0;font-family:var(--font-sans);color:var(--ljc-neutral-700);background:var(--ljc-neutral-50);line-height:1.75;font-size:15px}
/* 首页整页淡粉底（卡片保持白、页脚白——2026-09-30 拍板：粉=卷首+背景板，白=内容卡片） */
body.home{background:var(--ljc-pink-50)}
h1,h2,h3,h4,h5,h6,.brand,.entry h3,.stat .n,.tree-name{font-family:var(--font-display)}
a{color:var(--ljc-pink-600);text-decoration:none}
a:hover{color:var(--ljc-pink-400)}
.wrap{max-width:920px;margin:0 auto;padding:0 24px}
/* ---- 导航 ---- */
.nav{position:sticky;top:0;z-index:50;background:rgba(254,252,253,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--ljc-neutral-200)}
.nav-in{max-width:960px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--ljc-neutral-800)}
.brand .dot{width:8px;height:8px;border-radius:50%;background:var(--ljc-pink-300);display:inline-block}
.brand small{font-size:11px;color:var(--ljc-neutral-400);font-weight:400;margin-left:2px}
.nav-links{display:flex;gap:2px;flex-wrap:wrap}
.nav-links a{padding:6px 13px;font-size:13px;color:var(--ljc-neutral-500);border-radius:var(--ljc-radius-full)}
.nav-links a:hover{background:var(--ljc-pink-50);color:var(--ljc-pink-600)}
/* 小雪（AI）标记：淡蓝雪色系（用户裁决 09-29：弃紫色用主题蓝；卡片纯白底，只留蓝字蓝框；提示条圆角） */
.badge-xueji{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--ljc-blue-500);background:var(--ljc-blue-50);border:1px solid var(--ljc-blue-100);border-radius:var(--ljc-radius-full);padding:1px 9px;vertical-align:2px;white-space:nowrap}
.card.card-xueji,.card-xueji{border:1px solid var(--ljc-blue-100);background:var(--ljc-neutral-0)}
.card.card-xueji h3 a,.card-xueji h3 a{color:var(--ljc-blue-500)}
.xueji-note{margin:10px 0 4px;font-size:12.5px;color:var(--ljc-blue-500);background:var(--ljc-neutral-0);border:1px solid var(--ljc-blue-100);border-radius:var(--ljc-radius-m);padding:8px 14px}
.mod-title-xueji::before{background:var(--ljc-blue-500)}
.xueji-flake{color:var(--ljc-blue-500)}
.sec-xueji .sec-head h2{display:flex;align-items:center;gap:8px}
.nav-links a.on{font-weight:500;color:var(--ljc-pink-600);background:var(--ljc-pink-100)}
/* ---- 首页 ---- */
.hero{padding:88px 0 64px;text-align:center;background:var(--ljc-pink-50)}
.hero h1{font-size:40px;margin:0 0 10px;color:var(--ljc-neutral-900);letter-spacing:.01em}
.hero p{margin:6px 0;color:var(--ljc-neutral-500);font-size:15px}
.hero .status{display:inline-block;margin-top:14px;padding:6px 16px;border-radius:var(--ljc-radius-full);background:var(--ljc-neutral-0);border:1px solid var(--ljc-neutral-200);font-size:13px;color:var(--ljc-neutral-600)}
.hero .status b{color:var(--ljc-pink-600);font-weight:500}
.entries{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:-32px 0 0}
.entry{background:var(--ljc-neutral-0);border:1px solid var(--ljc-neutral-200);border-radius:var(--ljc-radius-l);padding:22px;display:block;color:inherit;transition:transform .15s ease,box-shadow .15s ease}
.entry:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(240,165,184,.15);color:inherit}
.entry h3{margin:0 0 6px;font-size:15px;color:var(--ljc-neutral-800)}
.entry p{margin:0;font-size:13px;color:var(--ljc-neutral-500)}
.entry .big{font-size:26px;font-weight:600;color:var(--ljc-pink-600);margin-bottom:2px}
/* ---- 区块 ---- */
section.block{padding:56px 0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:24px}
.sec-head h2{font-size:22px;margin:0;color:var(--ljc-neutral-800)}
.sec-head a{font-size:13px;color:var(--ljc-neutral-400)}
.card{background:var(--ljc-neutral-0);border:1px solid var(--ljc-neutral-200);border-radius:var(--ljc-radius-l);padding:20px 22px;margin-bottom:14px}
.card h3{margin:0 0 6px;font-size:15.5px;color:var(--ljc-neutral-800);font-weight:600}
.card h3 a{color:inherit}
.card .meta{font-size:12px;color:var(--ljc-neutral-400);margin-bottom:8px}
.card p{margin:0;font-size:14px;color:var(--ljc-neutral-600)}
.chip{display:inline-block;padding:2px 10px;border-radius:var(--ljc-radius-full);font-size:11.5px;background:var(--ljc-pink-50);color:var(--ljc-pink-600);margin-right:6px}
.chip.blue{background:var(--ljc-info-soft);color:var(--ljc-blue-500)}
.chip.green{background:var(--ljc-success-soft);color:var(--ljc-success)}
.chip.warn{background:var(--ljc-warning-soft);color:#B8860B}
.chip.gray{background:var(--ljc-neutral-100);color:var(--ljc-neutral-500)}
/* ---- 课程树 ---- */
.course-sec{margin-bottom:34px}
.course-sec .tag{font-size:12px;color:var(--ljc-neutral-400);margin:2px 0 4px}
.course-sec .intro{font-size:13.5px;color:var(--ljc-neutral-500);margin:0 0 14px}
.mod-title{font-size:15px;font-weight:600;color:var(--ljc-neutral-700);margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.mod-title::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--ljc-pink-300)}
.lec-row{display:flex;align-items:baseline;gap:12px;padding:9px 14px;border-radius:var(--ljc-radius-m);transition:background .12s ease}
.lec-row:hover{background:var(--ljc-pink-50)}
.lec-row .no{font-family:var(--font-mono);font-size:12px;color:var(--ljc-neutral-400);min-width:30px}
.lec-row .t{font-size:14px;color:var(--ljc-neutral-700);flex:1}
.lec-row .t a{color:inherit}
.lec-row .win{font-size:11.5px;color:var(--ljc-neutral-400)}
.lec-row.draft .t{color:var(--ljc-neutral-400)}
.lec-row.draft .t a{color:var(--ljc-neutral-400);pointer-events:none}
/* ---- 文章页 ---- */
article.doc{max-width:760px;margin:0 auto;padding:48px 24px 24px}
article.doc h1{font-size:28px;line-height:1.4;margin:8px 0 10px;color:var(--ljc-neutral-900)}
.doc-meta{font-size:13px;color:var(--ljc-neutral-400);margin-bottom:28px}
.doc-body{font-size:15.5px;line-height:1.9;color:var(--ljc-neutral-700)}
.doc-body h2{font-size:20px;color:var(--ljc-neutral-800);border-bottom:1px solid var(--ljc-neutral-200);padding-bottom:8px;margin:34px 0 14px}
.doc-body h3{font-size:17px;color:var(--ljc-neutral-800);margin:26px 0 10px}
.doc-body p{margin:0 0 16px}
.doc-body ul,.doc-body ol{padding-left:24px;margin:0 0 16px}
.doc-body code{font-family:var(--font-mono);font-size:.88em;background:var(--ljc-neutral-100);padding:2px 6px;border-radius:6px}
.doc-body pre{background:var(--ljc-neutral-900);color:#E8E5EE;padding:18px;border-radius:var(--ljc-radius-m);overflow-x:auto}
.doc-body pre code{background:none;color:inherit;padding:0}
.doc-body blockquote{margin:0 0 16px;padding:10px 18px;border-left:3px solid var(--ljc-pink-300);background:var(--ljc-pink-50);border-radius:0 var(--ljc-radius-m) var(--ljc-radius-m) 0;color:var(--ljc-neutral-600)}
.doc-body img{max-width:100%;border-radius:var(--ljc-radius-m)}
.doc-body picture{display:block;margin:0 0 16px}
.doc-cover{margin:4px 0 20px}
.doc-cover img,.doc-cover picture img{width:100%;height:auto;border-radius:var(--ljc-radius-m);border:1px solid var(--ljc-neutral-200)}
.doc-body table{border-collapse:collapse;width:100%;margin:0 0 16px;font-size:14px}
.doc-body th,.doc-body td{border:1px solid var(--ljc-neutral-200);padding:8px 12px;text-align:left}
.doc-body th{background:var(--ljc-neutral-100)}
.win-card{background:var(--ljc-pink-50);border:1px solid var(--ljc-pink-100);border-radius:var(--ljc-radius-l);padding:18px 22px;margin:0 0 28px}
.win-card h4{margin:0 0 8px;font-size:13px;color:var(--ljc-pink-600);letter-spacing:.06em}
.win-card ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--ljc-neutral-600)}
.win-card li{margin-bottom:3px}
.video-frame{position:relative;width:100%;padding-top:56.25%;border-radius:var(--ljc-radius-l);overflow:hidden;background:var(--ljc-neutral-900);margin:0 0 28px}
.video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
/* ---- 项目 ---- */
.proj-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.proj-head h1{margin:0}
.two-zone{display:grid;grid-template-columns:1fr;gap:34px}
.zone-title{font-size:13px;letter-spacing:.08em;color:var(--ljc-neutral-400);border-bottom:1px solid var(--ljc-neutral-200);padding-bottom:8px;margin:0 0 16px}
.tl{border-left:2px solid var(--ljc-pink-100);margin-left:6px;padding-left:22px}
.tl-item{position:relative;padding-bottom:26px}
.tl-item::before{content:'';position:absolute;left:-28px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--ljc-pink-300);border:2px solid var(--ljc-neutral-0)}
.tl-item .d{font-size:12px;color:var(--ljc-neutral-400);font-family:var(--font-mono)}
.tl-item h3{margin:2px 0 4px;font-size:15px}
.tl-item h3 a{color:var(--ljc-neutral-800)}
.tl-item p{margin:0;font-size:13.5px;color:var(--ljc-neutral-500)}
/* ---- 仪表盘/成就 ---- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:30px}
.stat{background:var(--ljc-neutral-0);border:1px solid var(--ljc-neutral-200);border-radius:var(--ljc-radius-l);padding:20px;text-align:center}
.stat .n{font-size:30px;font-weight:600;color:var(--ljc-pink-600)}
.stat .l{font-size:12.5px;color:var(--ljc-neutral-500);margin-top:2px}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;padding:10px 0}
.bars .b{flex:1;background:var(--ljc-pink-200);border-radius:6px 6px 0 0;min-height:2px;position:relative}
.bars .b span{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--ljc-neutral-400);white-space:nowrap}
/* ---- 页脚 ---- */
footer{border-top:1px solid var(--ljc-neutral-200);margin-top:88px;padding:44px 0 32px;background:var(--ljc-neutral-0)}
.foot-grid{display:grid;grid-template-columns:2fr 1fr 1.2fr;gap:28px}
@media(max-width:680px){
  .foot-grid{grid-template-columns:1fr;gap:24px}
  footer,footer *{text-align:left}
  footer .brand{justify-content:flex-start}
  .foot-nav{display:flex;flex-wrap:wrap;gap:8px}
  .foot-nav a{margin:0;padding:6px 13px;border:1px solid var(--ljc-neutral-200);border-radius:var(--ljc-radius-full);font-size:12.5px}
  .foot-qr img{width:84px;height:84px}
}
footer h6{font-size:11px;color:var(--ljc-neutral-400);letter-spacing:.08em;margin:0 0 12px;text-transform:uppercase}
footer a,footer span{display:block;font-size:13px;color:var(--ljc-neutral-500);margin-bottom:7px}
footer .about{font-size:13px;color:var(--ljc-neutral-500);max-width:280px}
.foot-qr{display:flex;gap:12px;align-items:center;margin-top:4px}
.foot-qr img{width:92px;height:92px;object-fit:cover;border-radius:var(--ljc-radius-m);border:1px solid var(--ljc-neutral-200);background:#fff}
.foot-qr .t{font-size:12px;color:var(--ljc-neutral-400);line-height:1.6}
.copyright{text-align:center;font-size:12px;color:var(--ljc-neutral-400);margin-top:30px}
.pagenote{text-align:center;font-size:12.5px;color:var(--ljc-neutral-400);padding:40px 0}
.empty{color:var(--ljc-neutral-400);font-size:13.5px;padding:24px;text-align:center;border:1px dashed var(--ljc-neutral-200);border-radius:var(--ljc-radius-m)}
/* ---- 首页 hero（姓名最大居中 + 三行标签） / 双栏 ---- */
.hero-name{font-size:64px;margin:0 0 8px!important;color:var(--ljc-neutral-900);letter-spacing:.06em;font-weight:700}
.hero-line2{font-size:24px;color:var(--ljc-neutral-600);margin:2px 0 0!important;letter-spacing:.22em}
.hero-line3{font-size:13.5px;color:var(--ljc-neutral-400);letter-spacing:.3em;margin:8px 0 0!important}
.home-two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:680px){.home-two{grid-template-columns:1fr}}
.mini-item{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px dashed var(--ljc-neutral-200);font-size:13.5px}
.mini-item:last-of-type{border-bottom:0}
.mini-item a{color:var(--ljc-neutral-700)}
.mini-item .meta{font-size:11.5px;color:var(--ljc-neutral-400);font-family:var(--font-mono);white-space:nowrap}
/* ---- 直播预告横幅（纯粉色） ---- */
.ls-banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--ljc-pink-50);border:1px solid var(--ljc-pink-100);border-radius:var(--ljc-radius-l);padding:14px 20px;margin:0 0 22px;color:var(--ljc-neutral-700);font-size:14px}
.ls-banner b{color:var(--ljc-pink-600)}
.ls-banner:hover{box-shadow:0 6px 18px rgba(240,165,184,.18)}
.ls-dot{width:9px;height:9px;border-radius:50%;background:var(--ljc-pink-500);animation:ls-pulse 1.6s ease-in-out infinite;flex-shrink:0}
@keyframes ls-pulse{0%,100%{box-shadow:0 0 0 0 rgba(240,165,184,.5)}50%{box-shadow:0 0 0 6px rgba(240,165,184,0)}}
.ls-meta{font-size:12.5px;color:var(--ljc-neutral-500);font-family:var(--font-mono)}
.ls-wrap{max-width:920px;margin:0 auto;padding-top:26px}
.sec-first{padding:64px 0 8px}
.ls-more{font-size:12.5px;color:var(--ljc-neutral-400);margin:-12px 0 22px;padding:0 6px}
/* ---- 纳瓦尔引言（两行分别成块，字号随屏宽自适应：每行刚好一行） ---- */
.quote-band{background:var(--ljc-pink-50);padding-bottom:56px}
.quote-block{max-width:640px;margin:0 auto;padding:26px 24px 0;text-align:center}
.quote-icon{color:var(--ljc-pink-300);display:inline-block;margin-bottom:10px}
.quote-rot{display:grid;width:100%}
.quote-slide{grid-area:1/1;display:flex;flex-direction:column;justify-content:center;align-items:center;opacity:0;transform:translateY(10px);visibility:hidden;transition:opacity .55s ease,transform .55s ease,visibility 0s .55s}
.quote-slide.on{opacity:1;transform:none;visibility:visible;transition:opacity .55s ease,transform .55s ease,visibility 0s 0s}
.quote-text{margin:0;color:var(--ljc-neutral-700);font-family:var(--font-display);letter-spacing:.02em}
.quote-text span{display:block;font-size:clamp(12.5px,4vw,17.5px);line-height:2}
.quote-text .q-nowrap{white-space:nowrap}
.quote-text .q-wrap{white-space:normal;max-width:34em;margin:0 auto}
@media(max-width:420px){.quote-text .q-wrap{font-size:13px}}
.quote-from{font-size:12.5px;color:var(--ljc-neutral-400);margin:14px 0 0!important;letter-spacing:.12em}
.quote-dots{position:relative;z-index:2;display:flex;gap:10px;justify-content:center;margin-top:20px}
.quote-dots i{width:9px;height:9px;border-radius:50%;background:var(--ljc-neutral-300);cursor:pointer;transition:all .25s ease;border:0;padding:0}
.quote-dots i:hover{background:var(--ljc-pink-300)}
.quote-dots i.on{background:var(--ljc-pink-500);width:28px;border-radius:var(--ljc-radius-full)}
/* ---- 福利卡 ---- */
.welfare-card .welfare-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.welfare-card h3{margin:0}
.welfare-icon{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:var(--ljc-radius-m);background:var(--ljc-pink-50);color:var(--ljc-pink-600);flex-shrink:0}
.welfare-code{font-size:13.5px;color:var(--ljc-neutral-600);margin:6px 0!important}
.welfare-code code{font-family:var(--font-mono);background:var(--ljc-pink-50);color:var(--ljc-pink-600);padding:3px 10px;border-radius:8px;font-size:14px;letter-spacing:.08em}
.welfare-go{display:inline-flex;align-items:center;gap:6px;font-size:14px}
/* ---- 平台入口（讲次/文章页，访客可见） ---- */
.plat-link{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border:1px solid var(--ljc-neutral-200);border-radius:var(--ljc-radius-full);margin:0 10px 10px 0;font-size:13px;color:var(--ljc-neutral-700);background:var(--ljc-neutral-0);transition:all .15s ease}
.plat-link:hover{border-color:var(--ljc-pink-300);color:var(--ljc-pink-600);box-shadow:0 3px 10px rgba(240,165,184,.15)}
/* SEO 隐藏摘要：sr-only 裁剪法——视觉零占位，语义/爬虫可达 */
.seo-note{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);clip-path:inset(50%);border:0}
/* ---- 作品集筛选条 ---- */
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.filter-chip{padding:5px 16px;border-radius:var(--ljc-radius-full);border:1px solid var(--ljc-neutral-200);background:var(--ljc-neutral-0);color:var(--ljc-neutral-500);font:inherit;font-size:13px;cursor:pointer;transition:all .15s ease}
.filter-chip:hover{border-color:var(--ljc-pink-300);color:var(--ljc-pink-600)}
.filter-chip.on{background:var(--ljc-pink-500);border-color:var(--ljc-pink-500);color:#fff;font-weight:500}
/* ---- 微信服务号二维码 ---- */
.qr-img{display:block;width:150px;height:150px;object-fit:cover;border-radius:var(--ljc-radius-m);border:1px solid var(--ljc-neutral-200);background:#fff;margin:6px 0}
/* ---- 课程折叠树 ---- */
.tree{margin:0 0 10px}
.tree-item{background:var(--ljc-neutral-0);border:1px solid var(--ljc-neutral-200);border-radius:var(--ljc-radius-l);margin-bottom:12px;overflow:hidden;transition:box-shadow .2s ease}
.tree-item:hover{box-shadow:0 4px 14px rgba(240,165,184,.1)}
.tree-head{display:flex;align-items:baseline;gap:12px;width:100%;text-align:left;background:none;border:0;padding:18px 22px;cursor:pointer;font:inherit}
.tree-arrow{color:var(--ljc-pink-400);font-size:13px;transition:transform .25s ease;flex-shrink:0}
.tree-item.open .tree-arrow{transform:rotate(90deg)}
.tree-name{font-size:17px;font-weight:600;color:var(--ljc-neutral-900);white-space:nowrap}
.tree-tag{font-size:12.5px;color:var(--ljc-pink-600);white-space:nowrap}
.tree-count{font-size:12px;color:var(--ljc-neutral-400);margin-left:auto;text-align:right}
.tree-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.tree-item.open .tree-body{grid-template-rows:1fr}
.tree-inner{overflow:hidden;padding:0 22px}
.tree-item.open .tree-inner{padding:4px 22px 18px}
/* 两级折叠：篇内模块行（默认收起） */
.tree-mod{border:1px solid var(--ljc-neutral-200);border-radius:var(--ljc-radius-m);margin:10px 0;overflow:hidden;background:var(--ljc-neutral-50);transition:border-color .2s ease}
.tree-mod:hover{border-color:var(--ljc-pink-200)}
.mod-head{display:flex;align-items:baseline;gap:10px;width:100%;background:none;border:0;padding:12px 16px;cursor:pointer;font:inherit;text-align:left}
.mod-arrow{color:var(--ljc-pink-400);font-size:12px;transition:transform .25s ease;flex-shrink:0}
.tree-mod.open .mod-arrow{transform:rotate(90deg)}
.mod-name{font-size:14.5px;font-weight:600;color:var(--ljc-neutral-800);font-family:var(--font-display)}
.mod-count{font-size:11.5px;color:var(--ljc-neutral-400);margin-left:auto;white-space:nowrap}
.mod-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.tree-mod.open .mod-body{grid-template-rows:1fr}
.mod-inner{overflow:hidden;padding:0 16px}
.tree-mod.open .mod-inner{padding:2px 16px 12px}
.mod-intro{font-size:12px;color:var(--ljc-neutral-400);margin:4px 0 6px!important}
/* ---- 小应用：首页滚动推荐区 + 专属页网格 + 弹层即玩（T035） ---- */
.lang-toggle{font-family:var(--font-display);font-weight:600;letter-spacing:.04em}
.app-card{background:var(--ljc-neutral-0);border:1px solid var(--ljc-neutral-200);border-radius:var(--ljc-radius-l);overflow:hidden;display:flex;flex-direction:column;transition:transform .15s ease,box-shadow .15s ease}
.app-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(240,165,184,.15)}
.app-cover{position:relative;aspect-ratio:16/9;background:var(--ljc-pink-50);display:flex;align-items:center;justify-content:center;color:var(--ljc-pink-600)}
.app-cover[data-app]{cursor:pointer}
.app-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.app-badge{position:absolute;top:10px;right:10px;z-index:2;background:var(--ljc-pink-500);color:#fff;font-size:11px;padding:2px 10px;border-radius:var(--ljc-radius-full)}
.app-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:7px;flex:1}
.app-body h3{margin:0;font-size:15px;color:var(--ljc-neutral-800)}
.app-body h3 a{color:inherit}
.app-body p{margin:0;font-size:12.5px;color:var(--ljc-neutral-500);flex:1}
.app-actions{display:flex;gap:10px;align-items:center;margin-top:2px}
.app-play{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:var(--ljc-radius-full);background:var(--ljc-pink-500);border:1px solid var(--ljc-pink-500);color:#fff;font:inherit;font-size:12.5px;cursor:pointer;transition:background .15s ease}
.app-play:hover{background:var(--ljc-pink-400)}
.app-ext{font-size:12px;color:var(--ljc-neutral-400)}
.app-ext:hover{color:var(--ljc-pink-600)}
.apps-wrap{position:relative}
.apps-scroll{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 4px 16px;scrollbar-width:thin}
.apps-scroll .app-card{flex:0 0 272px;scroll-snap-align:start}
.apps-arrow{position:absolute;top:34%;z-index:5;width:34px;height:34px;border-radius:50%;border:1px solid var(--ljc-neutral-200);background:var(--ljc-neutral-0);color:var(--ljc-neutral-500);cursor:pointer;font-size:15px;line-height:1;box-shadow:0 3px 10px rgba(40,38,58,.08);transition:all .15s ease}

.apps-arrow.next{right:-12px}
.apps-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.app-modal{position:fixed;inset:0;z-index:100;display:none}
.app-modal.on{display:block}
.app-modal-mask{position:absolute;inset:0;background:rgba(40,38,58,.55);backdrop-filter:blur(4px)}
.app-modal-box{position:relative;max-width:1020px;margin:3vh auto 0;background:var(--ljc-neutral-0);border-radius:var(--ljc-radius-l);overflow:hidden;display:flex;flex-direction:column;height:94vh;box-shadow:0 20px 60px rgba(40,38,58,.35)}
.app-modal-head{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--ljc-neutral-200)}
.app-modal-head .am-title{flex:1;font-size:14.5px;color:var(--ljc-neutral-800)}
.app-modal-head .am-open{font-size:12.5px;white-space:nowrap}
.app-modal-head .am-close{border:1px solid var(--ljc-neutral-200);background:var(--ljc-neutral-0);color:var(--ljc-neutral-500);border-radius:var(--ljc-radius-full);padding:5px 14px;font:inherit;font-size:12.5px;cursor:pointer}
.app-modal-head .am-close:hover{color:var(--ljc-pink-600);border-color:var(--ljc-pink-300)}
.app-modal-box iframe{flex:1;border:0;width:100%;background:#1a1926}
/* ---- 名词卡（正文专有名词：变色+虚线下划，点击弹窗释义） ---- */
.doc-body strong{color:var(--ljc-pink-600)}
.doc-body dfn.term{font-style:normal;font-weight:600;color:var(--ljc-pink-600);border-bottom:1.5px dashed var(--ljc-pink-300);padding-bottom:1px;cursor:pointer;transition:background .12s ease}

.term-modal{position:fixed;inset:0;z-index:110;display:none}
.term-modal.on{display:block}
.tm-mask{position:absolute;inset:0;background:rgba(40,38,58,.45);backdrop-filter:blur(3px)}
.tm-box{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100vw - 44px));background:var(--ljc-neutral-0);border:1px solid var(--ljc-pink-100);border-radius:var(--ljc-radius-l);padding:24px 26px 18px;box-shadow:0 20px 60px rgba(240,165,184,.28)}
.tm-kicker{font-size:11px;letter-spacing:.12em;color:var(--ljc-pink-500);margin-bottom:8px}
.tm-term{font-family:var(--font-display);font-size:18px;font-weight:600;color:var(--ljc-neutral-900);margin:0 0 10px}
.tm-def{font-size:14px;line-height:1.85;color:var(--ljc-neutral-600);margin:0 0 16px}

<script>
(function(){
  var nl=document.querySelector('.nav-links'); if(!nl) return
  var lastY=window.scrollY, locked=false
  window.addEventListener('scroll',function(){
    if(window.innerWidth>760){nl.classList.remove('hide');return}
    var y=window.scrollY, d=y-lastY
    if(locked){ lastY=y; return }
    if(d>18 && y>80){
      nl.classList.add('hide'); locked=true; lastY=y
      setTimeout(function(){locked=false},300)
    } else if(d<-20){
      nl.classList.remove('hide'); locked=true; lastY=y
      setTimeout(function(){locked=false},300)
    }
  },{passive:true})
  window.addEventListener('resize',function(){ if(window.innerWidth>760) nl.classList.remove('hide') })
  // 横向导航两侧虚化：左/右各有溢出时才虚化该侧（fl=左侧可滚，fr=右侧可滚）
  var fade=function(){
    var max=nl.scrollWidth-nl.clientWidth
    nl.classList.toggle('fl', nl.scrollLeft>4)
    nl.classList.toggle('fr', max>4 && nl.scrollLeft<max-4)
  }
  nl.addEventListener('scroll',fade,{passive:true}); window.addEventListener('resize',fade); window.addEventListener('load',fade); fade()
  })()
</script>
